name: Local pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: scraper/requirements.lock
      - run: npm run install:all
      - run: python -m pip install -r scraper/requirements.lock
      - run: npm run generate --prefix backend && git diff --exit-code schemas/dataset.d.ts
      - run: npm run lint
      - run: npm run types
      - run: npm test
      - run: npm run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-test-results
          path: frontend/test-results/
