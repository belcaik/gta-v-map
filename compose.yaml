name: ${COMPOSE_PROJECT_NAME:-gta-v-map}

services:
  map:
    image: ${MAP_IMAGE:-ghcr.io/belcaik/gta-v-map:latest}
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      DATA_ROOT: /data
      DB_PATH: /data/gta-v.db
      STATIC_ROOT: /app/frontend/dist
    ports:
      - "${BIND_HOST:-0.0.0.0}:${HTTP_PORT:-8080}:3002"
    volumes:
      - "${SERVER_DATA_DIR:-./data}:/data"
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:3002/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
